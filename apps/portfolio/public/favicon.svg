<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="parhim.dev">
  <style>
    .bg {
      fill: #0f1413;
    }
    .prompt {
      fill: none;
      stroke: #7ec4b5;
      stroke-width: 3.25;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
    .cursor {
      fill: #eef2f1;
      animation: blink 1.1s step-end infinite;
    }
    @media (prefers-color-scheme: light) {
      .bg {
        fill: #eef1f2;
      }
      .prompt {
        stroke: #1a4f48;
      }
      .cursor {
        fill: #141a1c;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .cursor {
        animation: none;
        opacity: 1;
      }
    }
    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0;
      }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7" />
  <path class="prompt" d="M8 9 L17 16 L8 23" />
  <rect class="cursor" x="20.5" y="9" width="2.25" height="14" rx="0.4" />
</svg>
